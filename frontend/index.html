<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1115" />
    <title>VibeSkool | Learn just enough code to build with AI</title>
    <meta name="description" content="Learn the minimum code you need to build real apps with AI: what to ask for, how to read what it writes, and how to fix it when it breaks. Short lessons, live tutors." />
    <script>
      // iPhones zoom the page in when a text field under 16px is tapped, and
      // don't zoom back out. maximum-scale stops that; iOS still lets people
      // pinch to zoom, so nothing is lost there. Android doesn't do the zoom,
      // so it keeps the plain viewport.
      (function() {
        var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0');
      })();
      (function() {
        try {
          var t = localStorage.getItem('vibeskool_theme');
          if (!t) {
            var s = localStorage.getItem('vibeskool_settings');
            if (s) { var p = JSON.parse(s); if (p && p.theme) t = p.theme; }
          }
          if (!t) t = 'dark';
          var resolved = t === 'dark' ? 'dark' : (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          var f = localStorage.getItem('vibeskool_font');
          if (f === 'geist' || f === 'serif') document.documentElement.setAttribute('data-font', f);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'dark' ? '#0F1115' : '#FFFFFF');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
