<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>VibeSkool — Minimum Effective Knowledge for Coding with AI</title>
    <meta name="description" content="Learn the Minimum Effective Knowledge (MEK) before coding with AI. Practical software fundamentals to prompt smart, fix bugs, and build real apps without getting lost in AI loops." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans (Display) + Inter (Body) — Geist Mono loaded via @fontsource -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('vibeskool_theme');
          if (!t) {
            var s = localStorage.getItem('vibeskool_settings');
            if (s) { var p = JSON.parse(s); if (p && p.theme) t = p.theme; }
          }
          if (!t) t = 'light';
          var resolved = t === 'dark' ? 'dark' : (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'dark' ? '#090A0F' : '#FFFFFF');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
